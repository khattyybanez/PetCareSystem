{% extends 'PetCare/base.html' %}

{% block title %}Delete {{ pet.name }} | PetCareSystem{% endblock %}

{% block content %}
<section class="confirm-card">
    <h1>Delete Pet Record</h1>
    <p>Are you sure you want to delete <strong>{{ pet.name }}</strong>'s record? This action cannot be undone.</p>
    <form method="post" class="form-actions">
        {% csrf_token %}
        <button class="button danger" type="submit">Delete Record</button>
        <a class="button secondary" href="{% url 'pets' %}">Cancel</a>
    </form>
</section>
{% endblock %}
