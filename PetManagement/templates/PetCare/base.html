<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PetCareSystem{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffaf5;
            color: #3d3028;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 18px max(5%, calc((100% - 1100px) / 2));
            background: white;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }
        nav strong { color: #8b5e3c; font-size: 22px; }
        nav a { color: #4d4038; text-decoration: none; margin-left: 18px; }
        nav a:hover { color: #a66a42; }
        main { width: min(1100px, 90%); margin: 42px auto; min-height: 65vh; }
        h1 { color: #6f472c; }
        .button {
            display: inline-block;
            padding: 11px 17px;
            border: 0;
            border-radius: 6px;
            background: #8b5e3c;
            color: white;
            text-decoration: none;
            font: inherit;
            cursor: pointer;
        }
        .button:hover { background: #6f472c; }
        .button.secondary { background: #766b63; }
        .button.danger { background: #a43e3e; }
        .table-wrap { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eadfd6; }
        th { background: #f3e8de; }
        .actions { white-space: nowrap; }
        .actions a { margin-right: 10px; }
        .form-card, .confirm-card {
            max-width: 700px;
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,.07);
        }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .field label { display: block; margin-bottom: 6px; font-weight: bold; }
        .form-control {
            width: 100%;
            min-height: 42px;
            padding: 9px;
            border: 1px solid #cfc3b9;
            border-radius: 5px;
            font: inherit;
        }
        .errors { color: #a43e3e; margin: 6px 0 0; }
        .form-actions { margin-top: 22px; display: flex; gap: 10px; }
        .empty { margin-top: 24px; padding: 24px; background: white; border-radius: 10px; }
        footer { padding: 20px; background: #8b5e3c; color: white; text-align: center; }
        @media (max-width: 700px) {
            nav { align-items: flex-start; flex-direction: column; }
            nav a { display: inline-block; margin: 8px 14px 0 0; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav>
        <strong>🐾 PetCareSystem</strong>
        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'pets' %}">Pet Records</a>
            <a href="{% url 'services' %}">Services</a>
        </div>
    </nav>
    <main>{% block content %}{% endblock %}</main>
    <footer>PetCareSystem | Caring for pets with love 🐾</footer>
</body>
</html>
